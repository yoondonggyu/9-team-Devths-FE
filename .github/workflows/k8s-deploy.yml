name: K8s CI/CD (Kaniko + Harbor + GitOps)

on:
  push:
    branches: [onprem]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, k8s, fe]
    steps:
      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Ensure kubectl is available
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -fsSLO "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            mkdir -p "$HOME/bin" && mv kubectl "$HOME/bin/kubectl"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: Render and apply Kaniko build Job
        run: |
          kubectl delete job "kaniko-fe-${{ steps.vars.outputs.sha_short }}" -n ci --ignore-not-found
          cat <<EOF | kubectl create -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: kaniko-fe-${{ steps.vars.outputs.sha_short }}
            namespace: ci
            labels: {app: kaniko-build, repo: fe}
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                restartPolicy: Never
                tolerations:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
                  effect: NoSchedule
                initContainers:
                - name: git-clone
                  image: alpine/git:latest
                  env:
                  - name: GIT_TOKEN
                    valueFrom:
                      secretKeyRef: {name: devths-manifests-pat, key: token}
                  command: ["sh", "-c"]
                  args:
                    - |
                      set -eu
                      git clone --depth 1 --branch "${{ github.ref_name }}" \
                        "https://x-access-token:\${GIT_TOKEN}@github.com/yoondonggyu/9-team-Devths-FE.git" /workspace
                      cd /workspace && git checkout "${{ github.sha }}"
                  volumeMounts:
                  - {name: workspace, mountPath: /workspace}
                  resources:
                    requests: {cpu: 100m, memory: 128Mi}
                    limits: {cpu: 300m, memory: 256Mi}
                containers:
                - name: kaniko
                  image: gcr.io/kaniko-project/executor:latest
                  args:
                  - --context=dir:///workspace
                  - --dockerfile=/workspace/Dockerfile
                  - --destination=harbor-core.harbor.svc.cluster.local/devths-fe/fe:${{ steps.vars.outputs.sha_short }}
                  - --insecure
                  - --snapshot-mode=redo
                  volumeMounts:
                  - {name: workspace, mountPath: /workspace}
                  - {name: docker-config, mountPath: /kaniko/.docker}
                  resources:
                    requests: {cpu: 500m, memory: 1.5Gi}
                    limits: {cpu: 1000m, memory: 2.5Gi}
                volumes:
                - {name: workspace, emptyDir: {}}
                - name: docker-config
                  secret:
                    secretName: harbor-devths-fe-push
                    items: [{key: .dockerconfigjson, path: config.json}]
          EOF

      - name: Wait for build to finish
        run: |
          if ! kubectl wait --for=condition=complete "job/kaniko-fe-${{ steps.vars.outputs.sha_short }}" -n ci --timeout=600s; then
            echo "::error::Kaniko build failed, dumping logs"
            POD=$(kubectl get pods -n ci -l job-name="kaniko-fe-${{ steps.vars.outputs.sha_short }}" -o jsonpath='{.items[0].metadata.name}')
            kubectl logs -n ci "$POD" -c git-clone || true
            kubectl logs -n ci "$POD" -c kaniko || true
            exit 1
          fi

      - name: Update GitOps manifest tag
        run: |
          git config --global user.email "ci@devths.local"
          git config --global user.name "devths-ci-bot"
          MANIFESTS_TOKEN=$(cat /etc/ci-secrets/manifests-token/token)
          rm -rf /tmp/devths-k8s-manifests
          git clone "https://x-access-token:${MANIFESTS_TOKEN}@github.com/yoondonggyu/devths-k8s-manifests.git" /tmp/devths-k8s-manifests
          cd /tmp/devths-k8s-manifests
          sed -i "s#harbor.devths.local/devths-fe/fe:.*#harbor.devths.local/devths-fe/fe:${{ steps.vars.outputs.sha_short }}#" apps/fe/deployment.yaml
          git commit -am "fe: deploy ${{ steps.vars.outputs.sha_short }}"
          git push
