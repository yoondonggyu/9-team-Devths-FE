name: FE 온프레미스 배포 (self-hosted)

on:
  push:
    branches: [onprem]
  workflow_dispatch:

concurrency:
  group: onprem-deploy-fe
  cancel-in-progress: false

env:
  # 러너와 fe-vm이 같은 머신(fe202 = 192.168.10.202)에 있어 SSH 홉 없이 로컬 실행.
  DEPLOY_DIR: /home/devops/9-team-Devths-FE

jobs:
  deploy:
    name: fe202 로컬 배포
    runs-on: self-hosted
    steps:
      - name: git pull → docker build → compose 재기동
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR}"

          echo "── git pull (onprem) ──"
          git fetch origin onprem
          git reset --hard origin/onprem

          IMAGE_TAG="onprem-$(git rev-parse --short HEAD)"
          echo "── docker build (${IMAGE_TAG}) ──"
          docker build -t "devths-fe:${IMAGE_TAG}" .

          echo "── .env ECR_IMAGE 갱신 ──"
          sed -i '/^ECR_IMAGE=/d' .env
          echo "ECR_IMAGE=devths-fe:${IMAGE_TAG}" >> .env

          echo "── compose 재기동 ──"
          docker compose up -d

          echo "── 헬스체크 ──"
          for i in $(seq 1 15); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
            [ "$code" = "200" ] && break
            [ "$i" -eq 15 ] && { echo "헬스체크 실패 (마지막 응답 코드=$code)"; exit 1; }
          done

          echo "── 오래된 이미지 정리 ──"
          docker image prune -f
